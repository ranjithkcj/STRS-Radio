<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>STRS Radio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:linear-gradient(135deg,#12002f,#001d3d 45%,#003c3c);
  color:#fff;font-family:Arial,sans-serif;
}
.app{
  max-width:430px;min-height:100vh;margin:auto;padding:38px 22px 30px;
  text-align:center;
}
.logo{
  width:112px;height:112px;margin:auto;border-radius:50%;
  background:linear-gradient(135deg,#ff2d95,#7c3aed,#00d4ff);
  border:4px solid rgba(255,255,255,.8);
  box-shadow:0 0 28px rgba(0,212,255,.45),0 0 45px rgba(255,45,149,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:29px;font-weight:bold;letter-spacing:2px;
}
h1{
  font-size:35px;letter-spacing:3px;margin:18px 0 6px;
  background:linear-gradient(90deg,#ffdf00,#ff4fa3,#63e6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tag{color:#d8eaff;margin-bottom:28px;font-size:15px}
.button{
  display:block;text-decoration:none;color:#fff;
  background:linear-gradient(90deg,#6d28d9,#db2777);
  border:1px solid rgba(255,255,255,.28);border-radius:15px;
  padding:17px 12px;margin:11px 0;font-size:17px;font-weight:bold;
  box-shadow:0 7px 18px rgba(0,0,0,.25);
  transition:transform .15s,filter .15s;
}
.button:hover{transform:translateY(-2px);filter:brightness(1.12)}
.live{
  background:linear-gradient(90deg,#00a878,#00b4d8,#4361ee);
  border-color:rgba(255,255,255,.5);
}
.section{
  margin-top:20px;padding:19px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);border-radius:16px;
  backdrop-filter:blur(8px);
}
h2{font-size:17px;margin:0 0 12px;color:#ffe66d;letter-spacing:1px}
.schedule{line-height:1.9;color:#f1f5ff;font-size:16px}
.footer{margin-top:26px;color:#b8c7e0;font-size:12px}
</style>
</head>
<body>
<div class="app">
<div class="logo">STRS</div>
<h1>STRS RADIO</h1>
<div class="tag">Listen Live • Tamil Radio</div>
<a class="button live" href="https://s3.radio.co/s234f55e14/listen" target="_blank">▶ LISTEN LIVE</a>
<div class="section"><h2>PROGRAM SCHEDULE</h2><div class="schedule">Friday — 9:00 PM<br>Sunday — 12:00 PM</div></div>
<div class="section"><h2>SONG REQUEST</h2>
<a class="button" href="https://wa.me/61470486593?text=Hello%20STRS%20Radio%2C%20I%20would%20like%20to%20request%20a%20song." target="_blank">WhatsApp 0470 486 593</a>
<a class="button" href="https://wa.me/61478385809?text=Hello%20STRS%20Radio%2C%20I%20would%20like%20to%20request%20a%20song." target="_blank">WhatsApp 0478 385 809</a>
</div>
<div class="footer">STRS Radio</div>
</div>
</body>
</html>
